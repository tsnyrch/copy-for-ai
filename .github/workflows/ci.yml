name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p copy-for-ai-core -p copy-for-ai-cli
      - run: cargo clippy --locked -p copy-for-ai-core -p copy-for-ai-cli --all-targets -- -D warnings
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p copy-for-ai-desktop
      - run: cargo test --locked -p copy-for-ai-desktop
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

